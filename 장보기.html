<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 집 장보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #4a3f3a;
    --ink-soft: #7d706a;
    --bg: #fff8f3;
    --paper: #ffffff;
    --line: #f0e4dc;
    --accent: #ff9fb6;
    --accent-dark: #e8708f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(#ffe3ea 1.5px, transparent 1.5px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: "Gaegu", "Comic Sans MS", sans-serif;
    font-weight: 700;
    font-size: 20px;
    line-height: 1.3;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }

  header { text-align: center; margin-bottom: 22px; }
  h1 { font-size: 46px; margin: 0; letter-spacing: 1px; }
  .count {
    display: inline-block; margin-top: 8px; padding: 4px 16px;
    background: #fff; border: 2.5px solid var(--accent); border-radius: 999px;
    font-size: 22px;
  }
  .bar { height: 12px; max-width: 340px; margin: 12px auto 0; background: #fff; border: 2.5px solid var(--line); border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .3s; }

  form.add {
    background: var(--paper); border-radius: 26px; padding: 18px;
    box-shadow: 0 4px 0 #f3d9cf, 0 8px 20px rgba(200,150,140,.15);
    display: grid; gap: 10px;
    grid-template-columns: 170px 1fr 120px 1fr auto;
    align-items: center; margin-bottom: 26px;
  }
  form.add select, form.add input {
    font: inherit; color: var(--ink); width: 100%;
    padding: 9px 14px; border: 2.5px solid var(--line); border-radius: 16px; background: #fffdfb;
    outline: none;
  }
  form.add input::placeholder { color: #b9aca6; font-weight: 400; }
  form.add select:focus, form.add input:focus { border-color: var(--accent); }
  .btn {
    font: inherit; font-size: 22px; cursor: pointer; border: none; color: #fff;
    background: var(--accent); padding: 9px 22px; border-radius: 16px;
    box-shadow: 0 4px 0 var(--accent-dark); transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-dark); }
  .qty-in { display: flex; align-items: center; gap: 6px; }
  .qty-in span { white-space: nowrap; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card {
    background: var(--c); border-radius: 28px; padding: 16px 16px 18px;
    box-shadow: 0 4px 0 var(--cd), 0 10px 22px rgba(160,130,120,.12);
  }
  .card h2 { font-size: 28px; margin: 0 0 10px 6px; display: flex; justify-content: space-between; align-items: center; }
  .card h2 small { font-size: 18px; color: var(--ink-soft); background: rgba(255,255,255,.7); padding: 0 10px; border-radius: 999px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .empty { color: var(--ink-soft); font-weight: 400; padding: 6px 10px; }

  li.item {
    background: rgba(255,255,255,.85); border-radius: 18px; padding: 8px 10px;
    display: flex; align-items: center; gap: 10px;
    transition: opacity .2s;
  }
  .check {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid var(--cd); background: #fff; cursor: pointer;
    display: grid; place-items: center; padding: 0; font: inherit; color: #fff; font-size: 18px;
  }
  .text { flex: 1; min-width: 0; cursor: pointer; }
  .name { font-size: 22px; word-break: break-all; }
  .memo { font-size: 17px; font-weight: 400; color: var(--ink-soft); word-break: break-all; }
  .qty { display: flex; align-items: center; gap: 2px; flex: none; }
  .qty button, .del {
    font: inherit; cursor: pointer; border: none; background: transparent; color: var(--ink);
    width: 28px; height: 28px; border-radius: 50%; font-size: 22px; line-height: 1; padding: 0;
  }
  .qty button:hover, .del:hover { background: var(--c); }
  .qty b { min-width: 26px; text-align: center; font-size: 21px; }
  .del { color: #c4a9a2; font-size: 20px; }

  li.done { opacity: .55; }
  li.done .check { background: var(--cd); }
  li.done .name { text-decoration: line-through; text-decoration-thickness: 2.5px; }

  .bottom { text-align: center; margin-top: 30px; }
  .btn.reset { background: #a8c8f0; box-shadow: 0 4px 0 #7fa6d6; font-size: 24px; padding: 10px 28px; }
  .btn.reset:active { box-shadow: 0 1px 0 #7fa6d6; }
  .note { margin-top: 10px; font-size: 17px; font-weight: 400; color: var(--ink-soft); }

  @media (max-width: 820px) {
    form.add { grid-template-columns: 1fr 1fr; }
    form.add .f-name, form.add .f-memo { grid-column: 1 / -1; }
    form.add .btn { grid-column: 1 / -1; }
    h1 { font-size: 38px; }
  }
  @media (max-width: 400px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>우리 집 장보기 🛒</h1>
    <div class="count" id="count"></div>
    <div class="bar"><div id="bar"></div></div>
  </header>

  <form class="add" id="addForm" autocomplete="off">
    <select id="cat" aria-label="종류"></select>
    <input id="name" class="f-name" placeholder="뭘 살까요? (예: 우유)" aria-label="이름" required>
    <div class="qty-in"><input id="qty" type="number" min="1" value="1" aria-label="수량"><span>개</span></div>
    <input id="memo" class="f-memo" placeholder="메모 (예: 저지방으로)" aria-label="메모">
    <button class="btn" type="submit">추가</button>
  </form>

  <div class="grid" id="grid"></div>

  <div class="bottom">
    <button class="btn reset" id="reset">🔄 다음 장보기 준비</button>
    <div class="note">품목은 그대로 두고 체크만 모두 풀어요</div>
  </div>
</div>

<script>
  const CATS = [
    { id: "veg",   label: "🥬 채소·과일",     c: "#dff5d8", cd: "#a6d99a" },
    { id: "meat",  label: "🥩 고기·생선",     c: "#ffe0e8", cd: "#f4a7bb" },
    { id: "dairy", label: "🥛 유제품·달걀",   c: "#dcefff", cd: "#9cc8ef" },
    { id: "snack", label: "🍞 가공식품·간식", c: "#fff4c7", cd: "#efd36e" },
    { id: "home",  label: "🧴 생활용품",      c: "#ece3ff", cd: "#bda7ee" },
    { id: "etc",   label: "📦 기타",          c: "#ffe9d9", cd: "#f4b98e" },
  ];
  const KEY = "jangbogi-list-v1";

  const SAMPLE = [
    ["veg", "양파", 3, ""], ["veg", "사과", 4, "부사로"],
    ["meat", "돼지고기 앞다리", 1, "600g"],
    ["dairy", "우유", 2, "저지방으로"], ["dairy", "달걀", 1, "30구"],
    ["snack", "식빵", 1, ""],
    ["home", "휴지", 1, ""],
  ];

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return SAMPLE.map(([cat, name, qty, memo]) => ({ id: uid(), cat, name, qty, memo, done: false }));
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }

  let items = load();

  const $ = (id) => document.getElementById(id);
  $("cat").innerHTML = CATS.map(c => `<option value="${c.id}">${c.label}</option>`).join("");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  function render() {
    $("grid").innerHTML = CATS.map(cat => {
      // 안 산 것이 위, 산 것이 아래 (같은 그룹 안에서는 추가한 순서)
      const list = items.filter(i => i.cat === cat.id).sort((a, b) => a.done - b.done);
      const left = list.filter(i => !i.done).length;
      const rows = list.length ? list.map(i => `
        <li class="item${i.done ? " done" : ""}" data-id="${i.id}">
          <button class="check" data-act="toggle" aria-label="체크">${i.done ? "✓" : ""}</button>
          <div class="text" data-act="toggle">
            <div class="name">${esc(i.name)}</div>
            ${i.memo ? `<div class="memo">${esc(i.memo)}</div>` : ""}
          </div>
          <div class="qty">
            <button data-act="minus" aria-label="수량 빼기">−</button>
            <b>${i.qty}</b>
            <button data-act="plus" aria-label="수량 더하기">+</button>
          </div>
          <button class="del" data-act="del" aria-label="삭제">✕</button>
        </li>`).join("") : `<li class="empty">아직 없어요</li>`;
      return `<section class="card" style="--c:${cat.c};--cd:${cat.cd}">
        <h2>${cat.label}<small>${left}/${list.length}</small></h2>
        <ul>${rows}</ul>
      </section>`;
    }).join("");

    const total = items.length, done = items.filter(i => i.done).length;
    $("count").textContent = total ? `${total}개 중 ${done}개 샀어요` : "목록이 비어 있어요";
    $("bar").style.width = total ? (done / total * 100) + "%" : "0";
  }

  $("grid").addEventListener("click", (e) => {
    const actEl = e.target.closest("[data-act]");
    const li = e.target.closest("li.item");
    if (!actEl || !li) return;
    const item = items.find(i => i.id === li.dataset.id);
    if (!item) return;
    const act = actEl.dataset.act;
    if (act === "toggle") item.done = !item.done;
    if (act === "plus") item.qty++;
    if (act === "minus") item.qty = Math.max(1, item.qty - 1);
    if (act === "del") items = items.filter(i => i !== item);
    save(); render();
  });

  $("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("name").value.trim();
    if (!name) return;
    const qty = Math.max(1, parseInt($("qty").value, 10) || 1);
    items.push({ id: uid(), cat: $("cat").value, name, qty, memo: $("memo").value.trim(), done: false });
    save(); render();
    $("name").value = ""; $("memo").value = ""; $("qty").value = 1;
    $("name").focus();
  });

  $("reset").addEventListener("click", () => {
    if (!items.some(i => i.done)) return alert("체크된 항목이 없어요!");
    if (!confirm("체크를 모두 풀까요? 품목은 그대로 남아요.")) return;
    items.forEach(i => i.done = false);
    save(); render();
  });

  render();
</script>
</body>
</html>
